
secrets:
  postgres_password:
    external: true
  django_secret_key:
    external: true
  seaweedfs_access_key:
    external: true
  seaweedfs_secret_key:
    external: true

configs:
  seaweedfs_entrypoint:
    file: ../seaweedfs/entrypoint.sh



volumes:
  dnt_db_data:
  seaweedfs_data:
  redis_data:

networks:
  dnt:
    driver: overlay
    attachable: true

services:
  redis:
    image: redis:7-alpine
    networks:
      - dnt
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    secrets:
      - source: seaweedfs_access_key
        target: aws_s3_access_key_id
      - source: seaweedfs_secret_key
        target: aws_s3_secret_access_key
    configs:
      - source: seaweedfs_entrypoint
        target: /seaweedfs-entrypoint.sh
        mode: 0555
    # Generates the S3 credentials config from the secrets above, then starts
    # master + volume + filer + S3 gateway in one process.
    entrypoint: ["/seaweedfs-entrypoint.sh"]
    command: ["server", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-filer", "-s3", "-s3.port=8333"]
    volumes:
      - seaweedfs_data:/data
    networks:
      - dnt
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dnt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - dnt_db_data:/var/lib/postgresql/data
    networks:
      - dnt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnt"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrations_and_static:
    image: ${IMAGE_TAG}
    env_file:
      - ./.env.dev
    environment:
      DJANGO_ENV: dev
      DEBUG: "1"
      REDIS_URL: redis://redis:6379/1
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: django_secret_key
        target: secret_key
      - source: seaweedfs_access_key
        target: aws_s3_access_key_id
      - source: seaweedfs_secret_key
        target: aws_s3_secret_access_key
    networks:
      - dnt
    command: >
      sh -lc "python wait_for_db.py && python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput"
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  backend:
    image: ${IMAGE_TAG}
    env_file:
      - ./.env.dev
    environment:
      DJANGO_ENV: dev
      DEBUG: "1"
      REDIS_URL: redis://redis:6379/1
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: django_secret_key
        target: secret_key
      - source: seaweedfs_access_key
        target: aws_s3_access_key_id
      - source: seaweedfs_secret_key
        target: aws_s3_secret_access_key
    networks:
      - dnt
    ports:
      - "8044:8000"
    command: >
      sh -lc "python wait_for_db.py && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health/" ]
      interval: 20s
      timeout: 5s
      retries: 10
