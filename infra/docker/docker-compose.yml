services:
  postgres:
    container_name: postgres_dnt
    image: postgres:16-alpine
    volumes:
      - postgres_data_dnt:/var/lib/postgresql/data
    env_file:
      - ../envs/.env.dev
    ports:
      - "5498:5432"
    networks:
      - backend-network-dnt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  app:
    container_name: backend_dnt
    restart: always
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: development
    volumes:
      - media:/app/src/media
      - static:/app/src/staticfiles
      - ../../src:/app/src
    env_file:
      - ../envs/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    ports:
      - "8099:8000"
    networks:
      - backend-network-dnt

  worker:
    container_name: worker_dnt
    restart: always
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: development
    command: arq apps.common.worker.WorkerSettings
    volumes:
      - ../../src:/app/src
    env_file:
      - ../envs/.env.dev
    depends_on:
      redis:
        condition: service_started
    networks:
      - backend-network-dnt

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs_dnt
    restart: always
    env_file:
      - ../envs/.env.dev # AWS_S3_ACCESS_KEY_ID / AWS_S3_SECRET_ACCESS_KEY
    # Generates the S3 credentials config from the keys above, then starts
    # master + volume + filer + S3 gateway in one process.
    entrypoint: ["/seaweedfs-entrypoint.sh"]
    # -s3.iam=false: the embedded IAM/STS API is unused (identities come from
    # the S3 config) and would only add attack surface.
    command: ["server", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-filer", "-s3", "-s3.port=8333", "-s3.iam=false"]
    ports:
      - "8333:8333"  # S3 API
      - "9333:9333"  # master UI
    volumes:
      - seaweedfs-data:/data
      - ../seaweedfs/entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - backend-network-dnt

  redis:
    container_name: redis_dnt
    image: redis:7-alpine
    ports:
      - "6399:6379"
    networks:
      - backend-network-dnt
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  postgres_data_dnt:
  media:
  static:
  seaweedfs-data:

networks:
  backend-network-dnt:
    driver: bridge
