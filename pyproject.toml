[project]
name = "dnt"
version = "0.1.0"
description = "Modern Django-Ninja Template with best practices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Core Django
    "django>=6.0.3,<7.0",
    "django-ninja>=1.6.2,<2.0",
    "django-split-settings>=1.3.2,<2.0",
    # Database
    "psycopg[binary,pool]>=3.2,<4.0",
    "pillow>=12.2.0,<13.0",
    # Authentication & Security
    "djangorestframework-simplejwt>=5.5,<6.0",
    "django-cors-headers>=4.9,<5.0",
    # Storage
    "django-storages>=1.14,<2.0",
    "boto3>=1.42,<2.0",
    # Utilities
    "python-dotenv>=1.2.2,<2.0",
    "pydantic>=2.12,<3.0",
    "loguru>=0.7,<1.0",
    # Caching & Redis (redis-py capped at <6 because arq pins redis[hiredis]<6)
    "redis>=5.0.1,<6.0",
    "django-redis>=6.0,<7.0",
    # Background tasks
    "arq>=0.26,<1.0",
    # Production server
    "gunicorn>=25.3.0,<26.0",
    "uvicorn>=0.43.0,<1.0",
    "whitenoise>=6.12.0,<7.0",
    "django-unfold>=0.87,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py314"
preview = true
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.13.2",
    "bandit[toml]>=1.7.9",
    "django-debug-toolbar>=4.2.0",
    "django-extensions>=3.2.3",
    "pytest>=7.4.3",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
]
